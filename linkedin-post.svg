<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="45%" stop-color="#0b2347"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Decorative code lines -->
  <g opacity="0.11" fill="none" stroke="#7dd3fc" stroke-width="3">
    <path d="M95 160 H330"/>
    <path d="M95 210 H460"/>
    <path d="M95 260 H250"/>
    <path d="M760 180 H980"/>
    <path d="M650 235 H980"/>
    <path d="M720 290 H980"/>
    <path d="M120 1110 H420"/>
    <path d="M120 1165 H320"/>
    <path d="M680 1120 H970"/>
    <path d="M760 1175 H970"/>
  </g>

  <!-- Abstract circles -->
  <circle cx="920" cy="120" r="155" fill="#00e5ff" opacity="0.10"/>
  <circle cx="110" cy="1220" r="210" fill="#7c3aed" opacity="0.12"/>
  <circle cx="930" cy="1040" r="95" fill="#22c55e" opacity="0.08"/>

  <!-- Main card -->
  <rect x="90" y="140" width="900" height="1070" rx="48" fill="#0f172a" opacity="0.92" filter="url(#shadow)"/>
  <rect x="90" y="140" width="900" height="1070" rx="48" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.65"/>

  <!-- Top label -->
  <rect x="140" y="210" width="240" height="58" rx="29" fill="url(#accent)" opacity="0.95"/>
  <text x="260" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">
    CODING TIPS
  </text>

  <!-- Main heading -->
  <text x="140" y="380" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#ffffff">
    Stop
  </text>
  <text x="140" y="465" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#ffffff">
    Tutorial Hell
  </text>

  <!-- Accent underline -->
  <rect x="140" y="510" width="350" height="10" rx="5" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Subtitle -->
  <text x="140" y="585" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" fill="#cbd5e1">
    Watching tutorials is not enough.
  </text>
  <text x="140" y="630" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" fill="#cbd5e1">
    Start building small things.
  </text>

  <!-- List items -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="165" cy="730" r="30" fill="#00e5ff" opacity="0.95"/>
      <text x="165" y="741" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">1</text>
      <text x="220" y="741" font-size="38" font-weight="700" fill="#ffffff">Learn one concept</text>
    </g>

    <g>
      <circle cx="165" cy="820" r="30" fill="#38bdf8" opacity="0.95"/>
      <text x="165" y="831" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">2</text>
      <text x="220" y="831" font-size="38" font-weight="700" fill="#ffffff">Build a mini project</text>
    </g>

    <g>
      <circle cx="165" cy="910" r="30" fill="#818cf8" opacity="0.95"/>
      <text x="165" y="921" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">3</text>
      <text x="220" y="921" font-size="38" font-weight="700" fill="#ffffff">Push it to GitHub</text>
    </g>

    <g>
      <circle cx="165" cy="1000" r="30" fill="#a78bfa" opacity="0.95"/>
      <text x="165" y="1011" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">4</text>
      <text x="220" y="1011" font-size="38" font-weight="700" fill="#ffffff">Improve it daily</text>
    </g>

    <g>
      <circle cx="165" cy="1090" r="30" fill="#22c55e" opacity="0.95"/>
      <text x="165" y="1101" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">5</text>
      <text x="220" y="1101" font-size="38" font-weight="700" fill="#ffffff">Repeat the process</text>
    </g>
  </g>

  <!-- Bottom quote box -->
  <rect x="140" y="1160" width="800" height="90" rx="24" fill="#020617" opacity="0.85"/>
  <text x="540" y="1217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#67e8f9">
    Coding improves by doing.
  </text>

  <!-- Footer -->
  <text x="540" y="1290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Learn • Build • Share • Repeat
  </text>
</svg>
